# Dev profile: H2 in-memory DB - zero setup, good for local dev & tests
spring:
  datasource:
    url: jdbc:h2:mem:maintenancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
logging:
  level:
    com.example.maintenance: DEBUG
