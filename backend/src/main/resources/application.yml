spring:
  application:
    name: maritime-maintenance-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLXNhbXBsZS1zaWduaW5nLWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  maintenance:
    # A schedule is flagged DUE_SOON when it falls inside either window below
    due-soon-days: 7
    due-soon-hours: 50
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
